name: Build & Deploy Hugo to GitHub Pages

on:
  push:
    branches: [ main ]   # ← change if your default branch is different
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true          # if your theme is a submodule
          fetch-depth: 0

      # Optional: cache Hugo's resources/ to speed up builds
      - name: Cache Hugo resources
        uses: actions/cache@v4
        with:
          path: resources
          key: hugo-${{ runner.os }}-${{ hashFiles('**/*') }}
          restore-keys: |
            hugo-${{ runner.os }}-

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true            # needed for Hugo Book / SCSS

      # If you use PostCSS/Autoprefixer, uncomment Node:
      # - uses: actions/setup-node@v4
      #   with:
      #     node-version: '20'

      - name: Build
        env:
          HUGO_ENV: production
          # For "project pages", set baseURL at build time if not in config:
          # HUGO_BASEURL: https://<username>.github.io/<repo>/
        run: |
          hugo --minify --gc
          touch public/.nojekyll      # avoid Jekyll processing

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4